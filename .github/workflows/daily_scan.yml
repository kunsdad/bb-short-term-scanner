
name: BB Daily Scanner

on:
  workflow_dispatch:
  schedule:
    # 한국시간 평일 오후 4시 30분
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BB scanner
        run: python scanner.py

      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Daily BB scan" && git push)
