name: BB Daily Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5' # 16:30 KST weekdays; Korean holidays not automatically excluded
permissions:
  contents: write
concurrency:
  group: bb-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run BB scanner
        env:
          PYTHONUNBUFFERED: '1'
          BB_WORKERS: '4'
        run: python -u scanner.py
      - name: Save results and history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/latest.csv data/status.json data/errors.json data/skipped.json data/price_diagnostics.json data/history.sqlite
          git diff --cached --quiet || (git commit -m "Daily BB scan" && git push)
