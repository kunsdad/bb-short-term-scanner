name: BB Historical Snapshot Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bb-daily-scan
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Recover historical scanner CSV files
        run: python archive_snapshots.py --recover
      - name: Commit recovered snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/snapshots/
          git diff --cached --quiet || (git commit -m "Archive historical BB scans" && git push)
